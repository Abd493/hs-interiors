<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C365"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#B0871D"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B0"/>
      <stop offset="45%" stop-color="#E5C365"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Squircle Badge with Golden Border matching brand identity -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="#141413" stroke="url(#goldBorder)" stroke-width="22" filter="url(#shadow)"/>
  <!-- Bold Serif Letters "HS" -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" fill="url(#goldText)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="240" letter-spacing="-3">HS</text>
</svg>