<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18"/>
      <stop offset="50%" stop-color="#12100F"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2D5"/>
      <stop offset="25%" stop-color="#E5C365"/>
      <stop offset="60%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8A6208"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C365"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#6E500A"/>
    </linearGradient>
  </defs>

  <!-- Luxury Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="105" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="14"/>
  <rect x="40" y="40" width="432" height="432" rx="85" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.35"/>

  <!-- BARA HS -->
  <text x="256" y="325" 
        font-family="'Cormorant Garamond', 'Georgia', 'Times New Roman', serif" 
        font-weight="bold" 
        font-size="228" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="2">HS</text>

  <!-- Accent Divider -->
  <line x1="176" y1="365" x2="236" y2="365" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="276" y1="365" x2="336" y2="365" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="256,358 263,365 256,372 249,365" fill="#F7E9B7"/>
</svg>